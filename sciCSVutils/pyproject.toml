
[project]
name = "sciCSVutils"
dynamic = ["version"]
description = "A Python script for plotting CSV exports of data from supported instruments."
authors = [
	{name = "Liam Twomey"},
]
maintainers = [
	{name="Liam Twomey"},
]
readme = "README.rst"
requires-python = ">=3.10"
keywords = ["biology","chromatography","protein"]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
classifiers = [
	"Private :: Do Not Upload",
	"Devlopment Status :: 4 - Beta",
	"Intended Audience :: Scientists",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
]
dependencies = [
	'pandas',
	'plotly',
	'pathlib',
]

[project.urls]
Repository = "https://github.com/Liam-Twomey/chemtools"
Issues = "https://github.com/Liam-Twomey/chemtools/issues"
Homepage = "https://github.com/Liam-Twomey/chemtools"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
csvPlot = "src"

[project.scripts]
# defines this as an executable for uv
csvPlot = "csvPlot.cli:main"

[tool.setuptools.dynamic]
version = {attr = "csvPlot.__version__"}

[tool.pytest.ini_options]
addopts = [
	"--import-mode=importlib",
]

[tool.ruff]
target-version = "py315"
indent-width = 4 
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
docstring-code-line-length = 80
